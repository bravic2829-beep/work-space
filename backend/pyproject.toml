[project]
name = "workbase-backend"
version = "0.1.0"
description = "WorkBase backend (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Alembic: long lines are not worth hand-wrapping.
"alembic/versions/*" = ["E501"]
# One-off measuring scripts hold long SQL strings.
"scripts/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is written as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
